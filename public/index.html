<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VPS Turnover">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<title>VPS Turnover</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#1b2430;--muted:#6b7685;--line:#e3e7ec;--brand:#1f3a5f;--ok:#1e8e4e;--okbg:#e6f5ec;--warn:#b5660a;--warnbg:#fdf1e2;--red:#c0392b;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:6px 10px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
h2{font-size:17px;margin:18px 4px 8px}
h3{font-size:15px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#eef1f5;color:var(--muted)}
.badge.reno{background:#fde8e6;color:#b02a1c}.badge.refresh{background:#e6effd;color:#1d5bb8}.badge.done{background:var(--okbg);color:var(--ok)}
.bar{height:8px;background:#e9edf2;border-radius:99px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--brand);color:#fff;font-weight:600;width:100%}
.btn.sec{background:#e9edf2;color:var(--ink)}.btn.red{background:#fbe9e7;color:var(--red)}.btn.sm{width:auto;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid #b8c1cc;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk:disabled{opacity:.35}
.task.isdone .t1{text-decoration:line-through;color:var(--muted)}
.t1{font-weight:500}
.who{font-size:13px;color:var(--muted);margin-top:2px}
.who b{color:var(--ink);font-weight:600}
.assign{border:1px dashed #b8c1cc;background:#fff;border-radius:8px;padding:2px 8px;font-size:13px;color:var(--brand);margin-top:4px}
.field{margin-bottom:12px}.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.field textarea{min-height:140px}
.toggle{display:flex;align-items:center;gap:10px;padding:6px 0}.toggle input{width:22px;height:22px}
.list-btn{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.pin{display:flex;justify-content:center;gap:12px;margin:16px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}.pin i.f{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.pad button{border:0;background:#fff;border-radius:14px;padding:16px 0;font-size:22px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#1b2430;color:#fff;padding:12px 14px;border-radius:12px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:15px;white-space:pre-line}
.push{background:#fff;color:var(--ink);border-left:4px solid var(--ok)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-width:720px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet .opt{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.filters{display:flex;gap:8px;overflow:auto;padding:2px 2px 8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.demo{background:#fff6d6;color:#6b5200;font-size:13px;padding:8px 12px;text-align:center}
.demo button{border:0;background:#6b5200;color:#fff;border-radius:8px;padding:3px 8px;margin-left:6px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
